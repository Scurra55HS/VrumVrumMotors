<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vrum Vrum Motors</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <h1>Vrum Vrum Motors</h1>
    <nav>
      <button onclick="filtrarCarros('todos')">Todos</button>
      <button onclick="filtrarCarros('sedan')">Sedans</button>
      <button onclick="filtrarCarros('suv')">SUVs</button>
      <button onclick="filtrarCarros('esportivo')">Esportivos</button>
      <button onclick="filtrarCarrosPorMarca('bmw')">BMW</button>
      <button onclick="filtrarCarrosPorMarca('porsche')">Porsche</button>
      <button onclick="filtrarCarrosPorMarca('audi')">Audi</button>
      <button onclick="filtrarCarrosPorMarca('toyota')">Toyota</button>
      <button onclick="filtrarCarrosPorMarca('honda')">Honda</button>
      <button onclick="filtrarCarrosPorMarca('ford')">Ford</button>
      <button onclick="filtrarCarrosPorMarca('jeep')">Jeep</button>
      <button onclick="filtrarCarrosPorMarca('chevrolet')">Chevrolet</button>
      <button onclick="filtrarCarrosPorMarca('nissan')">Nissan</button>
    </nav>
  </header>

  <!-- Catálogo dinâmico -->
  <section id="catalogo"></section>

  <!-- Overlay de Detalhes -->
  <div id="detalhes" class="overlay hidden">
    <div class="detalhes-card">
      <button class="close-btn" onclick="fecharDetalhes()">×</button>
      <img id="detalhes-imagem" src="" alt="Imagem do Carro">
      <h2 id="detalhes-titulo"></h2>
      <p><strong>Ano:</strong> <span id="detalhes-ano"></span></p>
      <p><strong>Preço:</strong> R$ <span id="detalhes-preco"></span></p>
      <p><strong>Descrição:</strong> <span id="detalhes-descricao"></span></p>
      <p><strong>Vantagens:</strong> <span id="detalhes-vantagens"></span></p>
    </div>
  </div>

  <!-- Agendamento e Mapa -->
  <section id="mapa">
    <section id="agendamento">
      <h2>Agendar Test Drive</h2>
      <div id="agendamento-container">
        <div id="form-wrapper">
          <form id="form-agendamento">
            <label for="carro">Carro Selecionado:</label>
            <input type="text" id="carro" readonly>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" required>

            <label for="data">Data preferencial:</label>
            <input type="date" id="data" required>

            <button type="submit">Agendar Test Drive</button>
          </form>
        </div>
        <div id="imagem-wrapper">
          <img id="imagem-carro" src="" alt="Imagem do Carro" style="display:none;">
        </div>
      </div>
    </section>
    <h2>Nosso Endereço</h2>
  <div class="map-responsive">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3765.815666806757!2d-99.09946737478923!3d19.290380731958795!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85ce03d465d90e11%3A0xd3b68638909d159b!2sIlha%20das%20Bonecas!5e0!3m2!1spt-BR!2sbr!4v1746088815829!5m2!1spt-BR!2sbr"
      frameborder="0"
      allowfullscreen
      loading="lazy"
    ></iframe>
  </div>
</section>
  <footer>&copy; 2025 Vrum Vrum Motors</footer>

  <script src="js/data.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
